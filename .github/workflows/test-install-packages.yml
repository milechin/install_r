name: Test install_packages.R

# Exercises install_packages.R (the package-migration script) end-to-end: the
# air-gap download -> offline install round-trip, the normal online install, and
# the download-mode resolution knobs. Runs in a rocker/r-ver container, which ships
# R preinstalled, so - unlike the install_R.sh workflow - nothing is built from
# source and the job is fast. A fresh container has only base+recommended packages,
# so the test's dependency packages are genuinely absent and really get installed.

on:
  push:
    branches: [ main ]
    paths:
      - 'install_packages/install_packages.R'
      - 'install_packages/list_packages.R'
      - 'test/install_packages/run_package_test.sh'
      - '.github/workflows/test-install-packages.yml'
  pull_request:
    paths:
      - 'install_packages/install_packages.R'
      - 'install_packages/list_packages.R'
      - 'test/install_packages/run_package_test.sh'
      - '.github/workflows/test-install-packages.yml'
  workflow_dispatch:
    inputs:
      image:
        description: 'rocker image to test in (R version), e.g. rocker/r-ver:4.5.2'
        required: false
        default: 'rocker/r-ver:latest'
        type: string

jobs:
  test-packages:
    name: Package workflow on ${{ inputs.image || 'rocker/r-ver:latest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: ${{ inputs.image || 'rocker/r-ver:latest' }}

    steps:
      - name: Install checkout prerequisites (git)
        # actions/checkout needs git; the rocker image is minimal.
        run: |
          apt-get update
          apt-get install -y git

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run package-workflow test
        run: bash test/install_packages/run_package_test.sh
